apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrations
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/your-org/express-microservices-auth-service:latest
          command: ["pnpm", "--filter", "auth-service", "migrate"]
          env:
            - name: AUTH_DATABASE_URL
              valueFrom: { secretKeyRef: { name: auth-service-secrets, key: database-url } }
---
