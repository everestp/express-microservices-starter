apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports: [{ name: http, port: 8081, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: notes-service
spec:
  selector: { app: notes-service }
  ports: [{ name: http, port: 8082, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
spec:
  selector: { app: audit-service }
  ports: [{ name: http, port: 8083, targetPort: http }]
