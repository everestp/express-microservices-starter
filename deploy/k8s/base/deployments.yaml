---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels: { app: audit-service }
    spec:
      containers:
        - name: audit-service
          image: ghcr.io/your-org/express-microservices-audit-service:latest
          ports: [{ name: http, containerPort: 8083 }]
          envFrom: [{ configMapRef: { name: service-config } }]
          env:
            - { name: AUDIT_SERVICE_PORT, value: "8083" }
