                name: SERVICE_TOKEN_SECRET,
                valueFrom: { secretKeyRef: { name: service-token-secrets, key: secret } },
              }
            - {
                name: AUDIT_DATABASE_URL,
                valueFrom: { secretKeyRef: { name: audit-service-secrets, key: database-url } },
              }
            - {
                name: NATS_URL,
                valueFrom: { secretKeyRef: { name: messaging-secrets, key: nats-url } },
              }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
