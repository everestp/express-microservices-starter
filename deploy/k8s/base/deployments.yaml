apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-org/express-microservices-gateway:latest
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: service-config } }]
          env:
            - { name: GATEWAY_PORT, value: "8080" }
            - {
                name: SERVICE_TOKEN_SECRET,
                valueFrom: { secretKeyRef: { name: service-token-secrets, key: secret } },
              }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/express-microservices-auth-service:latest
          ports: [{ name: http, containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: service-config } }]
          env:
            - { name: AUTH_SERVICE_PORT, value: "8081" }
            - {
                name: SERVICE_TOKEN_SECRET,
                valueFrom: { secretKeyRef: { name: service-token-secrets, key: secret } },
              }
            - {
                name: AUTH_DATABASE_URL,
                valueFrom: { secretKeyRef: { name: auth-service-secrets, key: database-url } },
              }
            - { name: JWT_PRIVATE_KEY_FILE, value: /var/run/jwt/private.jwk.json }
            - { name: JWT_PUBLIC_KEY_FILE, value: /var/run/jwt/public.jwk.json }
          volumeMounts: [{ name: jwt-keys, mountPath: /var/run/jwt, readOnly: true }]
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: jwt-keys
          secret: { secretName: auth-jwt-keys }
---
