apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services-from-gateway
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports: [{ protocol: TCP, port: 8081 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-from-gateway
spec:
  podSelector:
    matchLabels:
      app: notes-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
      ports: [{ protocol: TCP, port: 8082 }]
